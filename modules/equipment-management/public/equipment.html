<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Equipment - Sports Equipment Booking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-solid fa-medal"></i> SportsBook</a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="equipment.html">Equipment</a></li>
                    <li class="nav-item auth-hide"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item auth-hide"><a class="btn btn-primary ms-2" href="register.html">Register</a></li>
                    <li class="nav-item auth-show d-none"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item auth-show d-none"><a class="btn btn-outline-primary text-white ms-2" href="#" id="logout-btn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-4 mb-4">
        <div class="container">
            <h2 class="fw-bold m-0">Equipment Catalog</h2>
            <p class="text-light m-0">Browse and find the gear you need.</p>
        </div>
    </div>

    <main class="container pb-5">
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <label class="form-label fw-bold">Search</label>
                <input type="text" class="form-control" id="search" placeholder="Search equipment...">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label fw-bold">Category</label>
                <select class="form-select" id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Cricket">Cricket</option>
                    <option value="Football">Football</option>
                    <option value="Basketball">Basketball</option>
                    <option value="Badminton">Badminton</option>
                    <option value="Tennis">Tennis</option>
                    <option value="Volleyball">Volleyball</option>
                    <option value="Table Tennis">Table Tennis</option>
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label fw-bold">Sort By</label>
                <select class="form-select" id="sortFilter">
                    <option value="-createdAt">Newest First</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="-name">Name (Z-A)</option>
                </select>
            </div>
            <div class="col-md-3 mb-3 d-flex align-items-end">
                <button class="btn btn-primary w-100" id="applyFiltersBtn">Apply Filters</button>
            </div>
        </div>

        <div class="row g-4" id="equipment-container">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-orange" role="status"></div>
                <p class="mt-2 text-muted">Loading equipment...</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p class="mb-0">&copy; 2023 Sports Equipment Booking System.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/equipment.js"></script>
</body>
</html>
