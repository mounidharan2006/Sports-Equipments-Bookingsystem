<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sports Equipment Booking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html"><i class="fa-solid fa-medal"></i> SportsBook</a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="equipment.html">Equipment</a></li>
                    <li class="nav-item d-flex align-items-center">
                        <span class="text-light me-3 d-none d-lg-block">Welcome, <span id="user-name-nav" class="fw-bold text-orange">User</span></span>
                        <a class="btn btn-outline-primary text-white" href="#" id="logout-btn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar py-4">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="dashboard.html">
                                <i class="fa-solid fa-gauge-high me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="equipment.html">
                                <i class="fa-solid fa-magnifying-glass me-2"></i> Browse Equipment
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="my-bookings.html">
                                <i class="fa-solid fa-calendar-check me-2"></i> My Bookings
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="profile.html">
                                <i class="fa-solid fa-user me-2"></i> My Profile
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                    <h1 class="h2">Dashboard</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="equipment.html" class="btn btn-sm btn-primary">
                            <i class="fa-solid fa-plus me-1"></i> New Booking
                        </a>
                    </div>
                </div>

                <div class="row g-4 mb-4" id="stats-container">
                    <div class="col-md-4">
                        <div class="card text-center h-100 py-3 border-start border-4 border-primary">
                            <div class="card-body">
                                <i class="fa-solid fa-calendar text-primary fa-2x mb-2"></i>
                                <h5 class="card-title text-muted">Total Bookings</h5>
                                <h2 class="fw-bold mb-0" id="stat-total">-</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center h-100 py-3 border-start border-4 border-warning">
                            <div class="card-body">
                                <i class="fa-solid fa-hourglass-half text-warning fa-2x mb-2"></i>
                                <h5 class="card-title text-muted">Pending Bookings</h5>
                                <h2 class="fw-bold mb-0" id="stat-pending">-</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center h-100 py-3 border-start border-4 border-success">
                            <div class="card-body">
                                <i class="fa-solid fa-check-double text-success fa-2x mb-2"></i>
                                <h5 class="card-title text-muted">Active Bookings</h5>
                                <h2 class="fw-bold mb-0" id="stat-active">-</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <h4>Recent Bookings</h4>
                <div class="table-responsive bg-white rounded shadow-sm p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Ref #</th>
                                <th>Equipment</th>
                                <th>Dates</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recent-bookings-list">
                            <tr><td colspan="5" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
